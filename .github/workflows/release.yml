name: Publish release

on:
  push:
    branches: [main]
    paths: [RELEASE_VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'saladinxp/gitea-nebula-theme' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and verify public package
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat RELEASE_VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 build-theme.py
          python3 build-theme.py --check
          python3 -m unittest discover -s tests -v
          python3 package-theme.py
          archive="gitea-nebula-${version}.zip"
          test -s "$archive"
          mkdir release-assets
          cp "$archive" release-assets/
          cp update-nebula-theme.py release-assets/
          (cd release-assets && sha256sum gitea-nebula-*.zip update-nebula-theme.py > release-SHA256SUMS.txt)
          (cd release-assets && sha256sum -c release-SHA256SUMS.txt)
      - name: Upload, verify download, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(cat RELEASE_VERSION)"
          tag="v$version"
          resolve_tag() {
            local refs sha kind object
            refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")" || return
            sha="$(jq -r --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref) | .object.sha' <<< "$refs")" || return
            kind="$(jq -r --arg ref "refs/tags/$tag" '.[] | select(.ref == $ref) | .object.type' <<< "$refs")" || return
            while [[ "$kind" == tag ]]; do
              object="$(gh api "repos/$GH_REPO/git/tags/$sha")" || return
              sha="$(jq -r '.object.sha' <<< "$object")" || return
              kind="$(jq -r '.object.type' <<< "$object")" || return
            done
            if [[ -n "$sha" && "$kind" != commit ]]; then
              echo "Release tag does not point to a commit." >&2
              return 1
            fi
            printf '%s' "$sha"
          }
          # Leave published releases unchanged.
          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/nebula-release.json" 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' "$RUNNER_TEMP/nebula-release.json")" != true ]]; then
              echo "Release $tag is already published; leaving it unchanged."
              exit 0
            fi
            resume=true
          else
            resume=false
          fi
          existing_tag="$(resolve_tag)"
          if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag points to another commit; refusing to publish." >&2
            exit 1
          fi
          if [[ "$resume" == false ]]; then
            gh release create "$tag" release-assets/* \
              --target "$GITHUB_SHA" --title "Nebula for Gitea $version" \
              --notes-file RELEASE_NOTES.md --draft
          else
            remote_notes="$(gh release view "$tag" --json body --jq '.body')"
            [[ "$remote_notes" == "$(cat RELEASE_NOTES.md)" ]]
          fi
          verify_dir="$RUNNER_TEMP/nebula-release-verification"
          mkdir -p "$verify_dir"
          gh release download "$tag" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c release-SHA256SUMS.txt)
          # Resume a draft only when every uploaded byte matches this build.
          diff -r release-assets "$verify_dir"
          if [[ -z "$existing_tag" ]]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          [[ "$(resolve_tag)" == "$GITHUB_SHA" ]]
          gh release edit "$tag" --target "$GITHUB_SHA" --draft=false --latest
